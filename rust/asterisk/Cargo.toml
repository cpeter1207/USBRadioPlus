[package]
name = "usbradioplus-asterisk"
version = "0.1.0-alpha19"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"
description = "USBRadioPlus adapter for the Asterisk C ABI"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"

[build-dependencies]
bindgen = "0.72.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
