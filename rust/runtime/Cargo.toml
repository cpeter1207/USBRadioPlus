[package]
name = "usbradioplus-runtime"
version = "0.1.0-alpha18"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"
description = "USBRadioPlus generational real-time runtime"
publish = false

[dependencies]
usbradioplus-core = { path = "../core" }
usbradioplus-ffmpeg = { path = "../ffmpeg" }
