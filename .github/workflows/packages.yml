name: Publish Debian packages

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      package_version:
        required: true
        type: string
      package_revision:
        required: false
        default: "1"
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to package
        default: main
        required: true
        type: string
      package_version:
        description: Package version; blank uses VERSION
        default: ""
        required: false
        type: string
      package_revision:
        description: Debian package revision
        default: "1"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: debian-repository
  cancel-in-progress: false

jobs:
  build:
    env:
      DEBFULLNAME: USBRadioPlus Archive
      DEBEMAIL: cpeter1207@users.noreply.github.com
    strategy:
      fail-fast: false
      matrix:
        include:
          - debian: "12"
            suite: bookworm
            runner: ubuntu-24.04
            requested_api: auto
          - debian: "12"
            suite: bookworm
            runner: ubuntu-24.04-arm
            requested_api: auto
          - debian: "13"
            suite: trixie
            runner: ubuntu-24.04
            requested_api: auto
          - debian: "13"
            suite: trixie
            runner: ubuntu-24.04-arm
            requested_api: auto
          - debian: "13"
            suite: trixie
            runner: ubuntu-24.04-arm
            requested_api: modern
            target_asl_version: "2:22.10.1+asl3-3.10.5-1.deb13"
    runs-on: ${{ matrix.runner }}
    container: debian:${{ matrix.debian }}
    steps:
      - name: Install checkout tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates git
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install ASL3 repository and package tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y wget devscripts \
            debhelper dh-autoreconf build-essential pkg-config python3-pytest \
            lintian libsamplerate0-dev libavfilter-dev libavutil-dev \
            libasound2-dev libusb-dev libusb-1.0-0-dev portaudio19-dev
          wget -qO /tmp/asl-repo.deb \
            "https://repo.allstarlink.org/public/asl-apt-repos.deb${{ matrix.debian }}_all.deb"
          dpkg -i /tmp/asl-repo.deb
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y asl3-asterisk-dev
      - name: Build RNNoise companion packages
        run: |
          set -eux
          wget -qO /tmp/rnnoise.tar.gz \
            https://github.com/xiph/rnnoise/releases/download/v0.2/rnnoise-0.2.tar.gz
          echo '90fce4b00b9ff24c08dbfe31b82ffd43bae383d85c5535676d28b0a2b11c0d37  /tmp/rnnoise.tar.gz' | sha256sum -c -
          tar -C /tmp -xzf /tmp/rnnoise.tar.gz
          cp -a packaging/rnnoise/debian /tmp/rnnoise-0.2/
          cd /tmp/rnnoise-0.2
          dch --newversion "0.2-1.deb${{ matrix.debian }}" \
            --distribution "${{ matrix.suite }}" "Build for Debian ${{ matrix.debian }}."
          dpkg-buildpackage -b -us -uc
          lintian --fail-on error ../rnnoise_*.changes
          dpkg -i ../librnnoise0_*.deb ../librnnoise-dev_*.deb
      - name: Build USBRadioPlus package
        id: usbradioplus_build
        run: |
          set -eux
          package_version='${{ inputs.package_version }}'
          test -n "$package_version" || package_version=$(cat VERSION)
          if test '${{ matrix.requested_api }}' = modern; then
            modern_commit=32d268ad49aa44542704bce00873a0425bc71062
            modern_include=/tmp/asl-modern/include/asterisk
            mkdir -p "$modern_include"
            wget -qO "$modern_include/res_usbradio.h" \
              "https://raw.githubusercontent.com/AllStarLink/app_rpt/$modern_commit/include/asterisk/res_usbradio.h"
            wget -qO "$modern_include/rpt_chan_shared.h" \
              "https://raw.githubusercontent.com/AllStarLink/app_rpt/$modern_commit/include/asterisk/rpt_chan_shared.h"
            printf '%s  %s\n%s  %s\n' \
              1eb851d9c737e7da15936e09747bf1a47015c831a17b2d099bcb28c950a3944a \
              "$modern_include/res_usbradio.h" \
              7523e77d367ec8cd784711040789da2d3cc47584d2ac47c3b7788fbdc004832c \
              "$modern_include/rpt_chan_shared.h" | sha256sum -c -
            export ASL_RADIO_API=modern
            export CPPFLAGS=-I/tmp/asl-modern/include
            export ASL3_ASTERISK_VERSION='${{ matrix.target_asl_version }}'
          fi
          radio_api=$(make -s print-asl-radio-api)
          asl_version=$(dpkg-query -W -f='${Version}' asl3-asterisk)
          if test -n '${{ matrix.target_asl_version }}'; then
            asl_version='${{ matrix.target_asl_version }}'
          fi
          app_rpt_version=$(printf '%s\n' "$asl_version" | \
            sed -n 's/.*+asl3-\([0-9][0-9.]*\)-.*/\1/p')
          test -n "$app_rpt_version"
          asl_package_tag="${radio_api}.asl$(printf '%s' "$app_rpt_version" | tr -d '.')"
          echo "radio_api=$radio_api" >> "$GITHUB_OUTPUT"
          dch --newversion "$package_version-${{ inputs.package_revision }}.deb${{ matrix.debian }}+$asl_package_tag" \
            --distribution "${{ matrix.suite }}" "Build for Debian ${{ matrix.debian }}."
          dpkg-buildpackage -b -us -uc
          lintian --fail-on error ../usbradioplus_*.changes
          mkdir -p package-output
          cp /tmp/librnnoise0_*.deb /tmp/librnnoise-dev_*.deb \
            ../usbradioplus_*.deb package-output/
          printf 'suite=%s\narchitecture=%s\nasl3_asterisk=%s\napp_rpt=%s\nradio_api=%s\n' \
            '${{ matrix.suite }}' "$(dpkg --print-architecture)" \
            "$asl_version" "$app_rpt_version" "$radio_api" > package-output/build-info.txt
          test "$(dpkg-deb -f ../usbradioplus_*.deb Depends | \
            grep -c "asl3-asterisk (= $asl_version)")" = 1
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.suite }}-${{ runner.arch }}-${{ matrix.requested_api }}-${{ steps.usbradioplus_build.outputs.radio_api }}
          path: package-output/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: incoming
          merge-multiple: true
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y reprepro gnupg
      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          test -n "$APT_SIGNING_KEY"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
      - name: Build signed repository
        env:
          SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
        run: |
          set -eux
          rm -rf public
          mkdir -p public/conf
          git fetch origin apt-repository || true
          if git show-ref --verify --quiet refs/remotes/origin/apt-repository; then
            git archive origin/apt-repository | tar -x -C public
            find public/pool -name '*.deb' -exec cp --no-clobber -t incoming {} + 2>/dev/null || true
          fi
          rm -rf public/dists public/pool public/db public/conf
          mkdir -p public/conf
          cp packaging/repository/index.html packaging/repository/usbradioplus-archive-keyring.gpg public/
          for suite in bookworm trixie; do
            cat >> public/conf/distributions <<EOF
          Origin: USBRadioPlus
          Label: USBRadioPlus
          Codename: $suite
          Suite: $suite
          Architectures: amd64 arm64
          Components: main
          Description: USBRadioPlus alpha packages for ASL3
          SignWith: $SIGNING_FINGERPRINT

          EOF
          done
          for package in incoming/*.deb; do
            case "$package" in
              *.deb12_*|*.deb12+*_*) suite=bookworm ;;
              *.deb13_*|*.deb13+*_*) suite=trixie ;;
              *) echo "Cannot select suite for $package" >&2; exit 1 ;;
            esac
            reprepro -b public includedeb "$suite" "$package"
          done
          reprepro -b public export
          cp -a public site
          rm -rf site/conf site/db
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Save repository snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch --orphan apt-repository
          git rm -rf --ignore-unmatch .
          cp -a public/. .
          touch .nojekyll
          git add .
          git commit -m "Publish USBRadioPlus $(cat VERSION 2>/dev/null || echo packages)"
          git push --force origin HEAD:apt-repository

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    strategy:
      fail-fast: false
      matrix:
        include:
          - debian: "12"
            suite: bookworm
            runner: ubuntu-24.04
          - debian: "12"
            suite: bookworm
            runner: ubuntu-24.04-arm
          - debian: "13"
            suite: trixie
            runner: ubuntu-24.04
          - debian: "13"
            suite: trixie
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:${{ matrix.debian }}
    steps:
      - name: Install from the published signed repository
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl
          curl -fsSLo /tmp/asl-repo.deb \
            "https://repo.allstarlink.org/public/asl-apt-repos.deb${{ matrix.debian }}_all.deb"
          dpkg -i /tmp/asl-repo.deb
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y asl3-asterisk
          mkdir -p /tmp/config-before
          cp -a /etc/asterisk/modules.conf /etc/asterisk/rpt.conf /tmp/config-before/ 2>/dev/null || true
          install -d -m 0755 /etc/apt/keyrings
          for attempt in 1 2 3 4 5; do
            curl -fsSLo /etc/apt/keyrings/usbradioplus.gpg \
              https://cpeter1207.github.io/USBRadioPlus/usbradioplus-archive-keyring.gpg && break
            sleep 10
          done
          printf '%s\n' 'deb [signed-by=/etc/apt/keyrings/usbradioplus.gpg] https://cpeter1207.github.io/USBRadioPlus ${{ matrix.suite }} main' \
            > /etc/apt/sources.list.d/usbradioplus.list
          for attempt in 1 2 3 4 5; do apt-get update && break; sleep 10; done
          apt-cache policy usbradioplus
          DEBIAN_FRONTEND=noninteractive apt-get install -y usbradioplus
          module_dir=$(dirname "$(dpkg-query -L asl3-asterisk-modules | \
            sed -n '/\/app_rpt\.so$/ { p; q; }')")
          test -n "$module_dir"
          test -f "$module_dir/chan_usbradioplus.so"
          test -x /usr/sbin/usbradioplus-tune
          test -f /usr/share/man/man7/usbradioplus.7.gz
          cmp -s /tmp/config-before/modules.conf /etc/asterisk/modules.conf 2>/dev/null || \
            test ! -e /tmp/config-before/modules.conf
          cmp -s /tmp/config-before/rpt.conf /etc/asterisk/rpt.conf 2>/dev/null || \
            test ! -e /tmp/config-before/rpt.conf
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' \
            usbradioplus librnnoise0
