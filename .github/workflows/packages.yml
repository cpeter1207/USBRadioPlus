name: Publish Debian packages

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to package
        default: main
        required: true
        type: string
      package_version:
        description: Package version; blank uses VERSION
        default: ""
        required: false
        type: string
      package_revision:
        description: Debian package revision
        default: "1"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  packages:
    uses: cpeter1207/USBRadioPlus-Workflows/.github/workflows/packages.yml@main
    with:
      source_ref: ${{ inputs.source_ref }}
      package_version: ${{ inputs.package_version }}
      package_revision: ${{ inputs.package_revision }}
    secrets:
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
