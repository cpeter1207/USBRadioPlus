name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Version already committed to main for release (for example, 0.1.0~alpha1)
        required: true
        type: string
      changes:
        description: Concise Markdown release notes
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  release:
    uses: cpeter1207/USBRadioPlus-Workflows/.github/workflows/release.yml@main
    with:
      release_version: ${{ inputs.release_version }}
      changes: ${{ inputs.changes }}
      prerelease: ${{ inputs.prerelease }}

  publish-containers:
    needs: release
    uses: cpeter1207/USBRadioPlus-Workflows/.github/workflows/containers.yml@main
    with:
      publish: true
      release_version: ${{ inputs.release_version }}

  packages:
    needs: release
    uses: cpeter1207/USBRadioPlus-Workflows/.github/workflows/packages.yml@main
    with:
      source_ref: ${{ needs.release.outputs.tag_name }}
      package_version: ${{ inputs.release_version }}
    secrets:
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
