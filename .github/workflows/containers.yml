name: Build test containers

on:
  workflow_call:
    inputs:
      publish:
        required: false
        default: false
        type: boolean
      release_version:
        required: false
        default: ""
        type: string
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish prepared images to GitHub Container Registry
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
        architecture:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.architecture.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build and smoke-test installed image natively
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Dockerfile
          target: usbradioplus-installed
          platforms: ${{ matrix.architecture.platform }}
          build-args: |
            DEBIAN_VERSION=${{ matrix.debian }}
            RUN_SMOKE_TEST=1
          push: false
          cache-from: type=gha,scope=verify-${{ matrix.debian }}-${{ matrix.architecture.platform }}
          cache-to: type=gha,mode=max,scope=verify-${{ matrix.debian }}-${{ matrix.architecture.platform }}

  build:
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: tags
        shell: bash
        run: |
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          clean="ghcr.io/$owner/usbradioplus-asl3-debian${{ matrix.debian }}:clean"
          clean="$clean,ghcr.io/$owner/usbradioplus-asl3-debian${{ matrix.debian }}:sha-${GITHUB_SHA::12}"
          quality="ghcr.io/$owner/usbradioplus-quality-debian${{ matrix.debian }}:latest"
          quality="$quality,ghcr.io/$owner/usbradioplus-quality-debian${{ matrix.debian }}:sha-${GITHUB_SHA::12}"
          installed="ghcr.io/$owner/usbradioplus-debian${{ matrix.debian }}:sha-${GITHUB_SHA::12}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            installed="$installed,ghcr.io/$owner/usbradioplus-debian${{ matrix.debian }}:$version"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            installed="$installed,ghcr.io/$owner/usbradioplus-debian${{ matrix.debian }}:edge"
          fi
          if [[ -n '${{ inputs.release_version }}' ]]; then
            installed="$installed,ghcr.io/$owner/usbradioplus-debian${{ matrix.debian }}:${{ inputs.release_version }}"
          fi
          echo "clean=$clean" >> "$GITHUB_OUTPUT"
          echo "quality=$quality" >> "$GITHUB_OUTPUT"
          echo "installed=$installed" >> "$GITHUB_OUTPUT"
      - name: Build clean ASL3 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Dockerfile
          target: asl3-clean
          platforms: linux/amd64,linux/arm64
          build-args: DEBIAN_VERSION=${{ matrix.debian }}
          push: ${{ github.event_name == 'push' || inputs.publish }}
          tags: ${{ steps.tags.outputs.clean }}
          cache-from: type=gha,scope=clean-${{ matrix.debian }}
          cache-to: type=gha,mode=max,scope=clean-${{ matrix.debian }}
      - name: Build installed USBRadioPlus image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Dockerfile
          target: usbradioplus-installed
          platforms: linux/amd64,linux/arm64
          build-args: DEBIAN_VERSION=${{ matrix.debian }}
          push: ${{ github.event_name == 'push' || inputs.publish }}
          tags: ${{ steps.tags.outputs.installed }}
          cache-from: type=gha,scope=installed-${{ matrix.debian }}
          cache-to: type=gha,mode=max,scope=installed-${{ matrix.debian }}
      - name: Build prepared quality image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Dockerfile
          target: quality
          platforms: linux/amd64,linux/arm64
          build-args: DEBIAN_VERSION=${{ matrix.debian }}
          push: ${{ github.event_name == 'push' || inputs.publish }}
          tags: ${{ steps.tags.outputs.quality }}
          cache-from: type=gha,scope=quality-${{ matrix.debian }}
          cache-to: type=gha,mode=max,scope=quality-${{ matrix.debian }}

  required:
    name: Required container gate
    if: always()
    needs: [verify, build]
    runs-on: ubuntu-24.04
    steps:
      - env:
          BUILD_RESULT: ${{ needs.build.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$BUILD_RESULT" = success && test "$VERIFY_RESULT" = success
