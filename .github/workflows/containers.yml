name: Build test containers

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish prepared images to GitHub Container Registry
        required: false
        default: false
        type: boolean
      quality_only:
        description: Build only the reusable quality environments
        required: false
        default: false
        type: boolean
      release_version:
        description: Optional Debian version to publish as a Docker-compatible release tag
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  containers:
    uses: cpeter1207/USBRadioPlus-Workflows/.github/workflows/containers.yml@main
    with:
      publish: ${{ inputs.publish == true }}
      quality_only: ${{ inputs.quality_only == true }}
      release_version: ${{ inputs.release_version || '' }}
