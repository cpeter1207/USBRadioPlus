name: Required quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    if: github.event_name == 'push'
    uses: cpeter1207/USBRadioPlus-Workflows/.github/workflows/preflight.yml@main

  quality:
    if: github.event_name != 'push'
    uses: cpeter1207/USBRadioPlus-Workflows/.github/workflows/quality.yml@main
