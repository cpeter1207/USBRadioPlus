[package]
name = "usbradioplus-tune"
version = "0.1.0-alpha19"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"
description = "Interactive USBRadioPlus radio and processing tuner"
publish = false

[dependencies]
usbradioplus-core = { path = "../core" }

[lib]
name = "usbradioplus_tune"

[[bin]]
name = "usbradioplus-tune"
path = "src/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(coverage)"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
